[project]
name = "standard-asr"
version = "0.2.0.dev0"
description = "The open standard interface between apps and speech-to-text engines"
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 SPDX expression (Metadata 2.4). The bare `license = "Apache-2.0"`
# string keeps the license out of the free-text License field (the deprecated
# `{ file = ... }` form embeds the whole license text); `license-files` ships
# the file in the sdist/wheel. The OSI license *classifier* is intentionally
# omitted -- PEP 639 deprecates it as redundant with the expression.
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yi-Ting Chiu", email = "mytim710@gmail.com" }]
keywords = [
    "asr",
    "speech-to-text",
    "speech-recognition",
    "stt",
    "transcription",
    "audio",
    "streaming",
    "plugin",
    "interface",
    "protocol",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    # Direct dependencies declare a meaningful, verified lower bound and NO
    # speculative upper cap. Interpreter-conditional numpy floor: numpy 1.x has
    # no cp313 wheel, so 3.13+ needs numpy 2.x.
    "numpy>=1.26; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "pydantic>=2.5",
]

[project.scripts]
standard-asr = "standard_asr.toolchain.cli:main"

[project.urls]
Homepage = "https://github.com/standard-voice/standard_asr"
Repository = "https://github.com/standard-voice/standard_asr"
Documentation = "https://standard-voice.github.io/standard_asr/"
Issues = "https://github.com/standard-voice/standard_asr/issues"
Changelog = "https://github.com/standard-voice/standard_asr/blob/main/CHANGELOG.md"

# PEP 735 dependency groups. `dev` aggregates the focused groups so a single
# `uv sync` (dev is uv's default group) installs everything for local work + CI.
[dependency-groups]
test = [
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    # The FastAPI server tests drive it via Starlette's `TestClient`, which since
    # Starlette 1.2 runs on the `httpx2` transport; httpx2>=2.0 is that transport.
    # fastapi>=0.133 mirrors the [server] extra's security floor (see the GHSA
    # rationale there). It also subsumes the earlier fastapi>=0.118 multipart
    # floor, where `bytes = File(...)` coerces a filename'd part to bytes (0.116
    # still 422'd) — that floor was verified by the pre-migration lower-bounds
    # lane and is kept as history; today's lane resolves fastapi 0.133 and can no
    # longer re-test it. The lower-bounds CI lane verifies the CURRENT floors:
    # fastapi 0.133, httpx2 2.0, starlette 1.3.1.
    "httpx2>=2.0",
    "fastapi>=0.133",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    # Mirror the [server] extra's WS library so the dev/CI environment matches
    # the documented `standard-asr[server]` install (TestClient bypasses the
    # real WS transport, which is how a missing WS lib stayed green in CI).
    "websockets>=12",
]
lint = ["ruff>=0.12.11"]
typing = ["pyright>=1.1.405"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typing" },
]

[project.optional-dependencies]
audio = ["soundfile>=0.12", "scipy>=1.10"]
# griffelib distributes the `griffe` module; docs/site/scripts/dump_api.py
# reads the package with it to generate the API reference data. The site
# itself is a Node application (docs/site) and is not installed from here.
docs = [
    "griffelib>=2.2",
]
# websockets is REQUIRED here: server.md promises a WebSocket streaming
# endpoint, and bare uvicorn ships no WS protocol implementation -- without it
# /v1/stream answers 404 on upgrade Pinned explicitly
# instead of `uvicorn[standard]`, which would drag in uvloop/watchfiles/etc.
# Security floor (the load-bearing rationale for both floors below): all five
# 2026 Starlette advisories — GHSA-82w8-qh3p-5jfq (high, fixed in 1.3.1),
# GHSA-wqp7-x3pw-xc5r (high, 1.1.0), GHSA-x746-7m8f-x49c (medium, 1.1.0),
# GHSA-86qp-5c8j-p5mr (medium, 1.0.1), GHSA-jp82-jpqv-5vv3 (low, 1.3.0) — are
# fixed only on the Starlette 1.x line, with no 0.x backports. starlette>=1.3.1
# is therefore declared DIRECTLY as a fail-loud floor: an app that pins a
# vulnerable Starlette gets a resolver error, not a silently vulnerable server.
# fastapi>=0.133 is the companion floor — the first release to drop FastAPI's
# own `starlette<1.0.0` cap (0.132 still pins it), i.e. the lowest fastapi that
# can coexist with the patched line; it also subsumes the earlier 0.118
# multipart floor. The runtime code itself needs neither (it uses long-stable
# FastAPI APIs); these floors exist for security and are what the lower-bounds
# CI lane verifies.
server = [
    "fastapi>=0.133",
    "starlette>=1.3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30",
    "websockets>=12",
]

[build-system]
# Cap the build backend: uv_build can introduce breaking sdist/wheel format
# changes between minors (uv's own build warns without this bound). This governs
# the BUILD tool, not a runtime dependency, so the "no caps on deps" policy does
# not apply. Bump deliberately alongside the [tool.uv] required-version.
requires = ["uv-build>=0.11.21,<0.12"]
build-backend = "uv_build"

[tool.uv]
# Guard against contributors rewriting the lockfile format with an old uv.
required-version = ">=0.11.21"

[tool.uv.build-backend]
module-root = "src"
module-name = "standard_asr"
# uv_build does NOT honor .gitignore, and it packages every file under the
# module directory. Explicitly keep stray artifacts (a coverage DB that landed
# in the package dir, scratch notes) from leaking downstream. The `build` CI job
# asserts this stays true.
# - wheel-exclude: the wheel contains ONLY the module (src/standard_asr), where
#   no legitimate .md lives, so excluding *.md there is safe and blocks scratch
#   notes. (README.md sits at the repo root and is never in the wheel anyway.)
# - source-exclude: the sdist legitimately ships the root README.md (referenced
#   by `readme = "README.md"`), so we must NOT exclude *.md here — only the
#   coverage DBs.
wheel-exclude = ["*.md", ".coverage", ".coverage.*"]
source-exclude = [".coverage", ".coverage.*"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src/standard_asr", "tests", "docs/site/scripts"]
pythonVersion = "3.10"
reportMissingModuleSource = "warning"
reportUnusedVariable = "error"
# Downgraded from strict's default "error": this check is hostage to the
# completeness of third-party type stubs (notably numpy, whose stubs for
# clip/reshape/etc. vary across the 1.26 -> 2.x -> nightly versions we
# deliberately test). Keep it visible as a warning; every other strict check
# stays an error.
reportUnknownMemberType = "warning"

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--maxfail=1",
    "--cov=standard_asr",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
testpaths = ["tests"]
# Warnings-as-errors so OUR deprecations/bugs fail the suite. No third-party
# ignores at present: the last two (classic-httpx TestClient deprecations) left
# with the httpx2 migration. Any new ignore must be targeted and justified here.
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
source = ["standard_asr"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# NPY201 flags numpy 2.0 removed/renamed APIs so the core stays compatible with
# both numpy 1.x and 2.x. E/F/I/W are baseline lint + import order. D is
# pydocstyle (Google convention) — it enforces the docstring structure that
# STYLE.md requires.
select = ["E", "F", "I", "W", "NPY201", "D"]
# D107: the API reference merges __init__ into the class signature
# (docs/site/scripts/dump_api.py), so it needs no separate docstring. D105:
# trivial container dunders (__len__, __iter__, __repr__) need none either.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are exempt from pydocstyle (D) STRUCTURE rules only: we do not force a
# docstring onto every test function or fixture. Test prose itself is still
# governed by STYLE.md (wording, terms, spelling), which the linter cannot check.
"tests/**" = ["D"]
# Illustrative sample code under docs/ is not part of the shipped library.
"docs/**" = ["D"]
