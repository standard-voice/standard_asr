extends: substitution
message: "Prefer '%s' over '%s' for the engine test surface. 'Conformance' stays approved only for cross-language wire conformance (TERMINOLOGY.md, compliance row)."
link: https://github.com/standard-voice/standard_asr/blob/main/TERMINOLOGY.md
level: warning
ignorecase: true
# TERMINOLOGY.md keeps 'conformance' for the cross-language wire sense; in
# this repo both 'wire conformance' and 'cross-language conformance' can only
# carry that sense, so both bigrams pass. RE2 has no lookbehind, so the token
# consumes the optional prefix and the exception then filters the matched
# text (spaced, hyphenated, or wrapped across a line break); every bare
# 'conformance' is flagged. No action block: this is a judgment call, not a
# mechanical 1:1 replacement.
exceptions:
  - '(?:wire|cross-language)[-\s]conformance'
swap:
  '(?:(?:wire|cross-language)[-\s])?conformance': compliance
