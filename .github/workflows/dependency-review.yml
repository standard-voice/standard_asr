name: Dependency Review

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: License & vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          vulnerability-check: true
          fail-on-severity: moderate
          license-check: true
          # Allowlist: every license present in our distributed dependency
          # surface (runtime + extras). Uses ClearlyDefined metadata — no
          # deep-scan, so no false positives from bundled components.
          # MIT-0 entered with cffi 2.1.1 (PyPI license_expression: MIT-0).
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0,
            CC0-1.0, CC-BY-4.0, ISC, MIT, MIT-0, MPL-2.0, PSF-2.0,
            Python-2.0, Unlicense, Zlib
          # typing-extensions declares PSF-2.0 (allowed), but ClearlyDefined's
          # scancode harvest of its LICENSE file reads the historical Python
          # stack as "Python-2.0 AND GPL-1.0-or-later AND ..." — a metadata
          # false positive, so the package is exempted, not the license.
          #
          # fumadocs-ui is an npm alias for @fumadocs/base-ui (pinned 16.15.0
          # in docs/site/package.json, kept so imports match the upstream
          # fumadocs-ui paths). The scanner cannot resolve license metadata
          # through the alias identity and reports it as unknown — which the
          # action does not fail on — while the aliased package itself
          # resolves to MIT (its package.json license field and the npm
          # registry agree). Exempted explicitly so the gap is on record,
          # not silently tolerated.
          allow-dependencies-licenses: pkg:pypi/typing-extensions, pkg:npm/fumadocs-ui
          comment-summary-in-pr: always
