name: CI

# Primary pull-request gate (dependency-policy channel 1). Everything here runs
# against the committed uv.lock (`--locked`), so CI is byte-for-byte reproducible
# and a stale lock fails loudly. The lower-bounds lane additionally re-resolves
# at each direct dependency's floor (`--resolution lowest-direct`) to keep the
# declared lower bounds honest. Branch protection requires the single aggregate
# check `checks-complete` (ADR D8); do NOT add path filters here — a skipped
# required check would block merges forever.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin uv so resolution/lock behavior is reproducible across runs and matches
  # the [tool.uv] required-version floor. Bump deliberately.
  UV_VERSION: "0.11.21"

jobs:
  lock-check:
    name: Lock up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

  lint:
    name: Lint & Typecheck (Ruff + Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras --all-groups
      - name: Ruff format check
        run: uv run --no-sync ruff format --check
      - name: Ruff lint
        run: uv run --no-sync ruff check
      - name: Pyright
        run: uv run --no-sync pyright

  test:
    name: Test py${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Full Python support range (ADR D7) on Linux ...
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # ... plus macOS/Windows edges on a representative interpreter so the
          # cross-platform contract (audio I/O, path handling) stays green.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    env:
      # Force uv to the matrix interpreter (overrides .python-version).
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked --all-extras --all-groups
      - name: Run tests
        run: uv run --no-sync pytest

  lower-bounds:
    name: Lower bounds (lowest-direct, py3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve at each direct dependency's floor and install
        # No --locked: this lane deliberately re-resolves to the lowest
        # compatible direct versions to prove the declared lower bounds work.
        run: uv sync --resolution lowest-direct --all-extras --all-groups
      - name: Run tests
        run: uv run --no-sync pytest

  core-floor:
    # The lower-bounds lane cannot reach the core `pydantic>=2.5` floor: uv
    # resolves one universal set for the whole project, and the [server] extra's
    # fastapi requires pydantic>=2.7.0, so that lane always installs 2.7 (#80).
    # This lane installs the bare `standard-asr` shape instead -- the core
    # dependencies plus the `test` group, no extras -- which is exactly the
    # install every application gets from `pip install standard-asr`. It uses
    # `uv pip install` rather than `uv sync` on purpose: `uv sync` resolves the
    # universal lock first and only then picks what to install, so no group or
    # extra selection can keep fastapi's constraint out of the resolution.
    name: Core floor (py3.10, no extras)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve the core dependencies at their lowest compatible versions
        run: |
          uv venv
          uv pip install --resolution lowest-direct --editable . --group test
      - name: Assert every core dependency sits at its declared floor
        # The floors come from the installed package metadata, so this lane
        # cannot drift from pyproject.toml the way its name once drifted from
        # what it installed.
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          from importlib.metadata import requires, version

          from packaging.requirements import Requirement
          from packaging.version import Version

          drift = []
          for raw in requires("standard-asr") or []:
              req = Requirement(raw)
              if req.marker is not None and not req.marker.evaluate():
                  continue
              floors = [s.version for s in req.specifier if s.operator == ">="]
              if len(floors) != 1:
                  drift.append(f"{req.name}: expected one >= bound, found '{req.specifier}'")
                  continue
              got, floor = Version(version(req.name)), Version(floors[0])
              print(f"{req.name} {got} (declared floor {floor})")
              if got.release[: len(floor.release)] != floor.release:
                  drift.append(f"{req.name} is {got}, not the declared floor {floor}")
          for line in drift:
              print(f"::error::{line}")
          sys.exit(1 if drift else 0)
          PY
      - name: Run tests
        run: uv run --no-sync pytest --no-cov

  numpy-floor:
    # The lower-bounds lane runs on py3.10, where the active numpy floor is
    # `numpy>=1.26`. The OTHER declared floor — `numpy>=2.1` for py>=3.13 — would
    # otherwise never be exercised at its floor (a full lowest-direct on 3.13 is
    # impractical: pydantic's floor lacks cp313 wheels). So we pin numpy to its
    # py3.13 floor against the locked rest and run the suite, keeping that floor
    # honest (ADR D4).
    name: numpy floor (py3.13, numpy 2.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked deps, then pin numpy to the py3.13 floor (>=2.1)
        run: |
          uv sync --locked --all-extras --all-groups
          uv pip install "numpy==2.1.*"
      - name: Show numpy version
        run: uv run --no-sync python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Run tests
        run: uv run --no-sync pytest

  build:
    # Packaging-hygiene gate (ADR D1): build the wheel and assert it ships ONLY
    # source files (.py/.pyi/py.typed). uv_build ignores .gitignore and packages
    # everything under the module dir, so this guards against stray artifacts
    # (a coverage DB, scratch notes) leaking to downstream consumers.
    name: Build & package hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build sdist and wheel
        run: uv build --package standard-asr --no-sources --out-dir dist --clear
      - name: Assert the wheel ships only source files
        run: |
          contents="$(unzip -Z1 dist/*.whl)"
          echo "${contents}"
          # Files inside the package dir that are NOT .py/.pyi/py.typed (ignore
          # directory entries and the dist-info metadata dir).
          stray="$(printf '%s\n' "${contents}" \
            | grep -E '^standard_asr/' \
            | grep -vE '(/|\.py|\.pyi|/py\.typed)$' || true)"
          if [ -n "${stray}" ]; then
            echo "::error::Wheel ships unexpected non-source files:"
            printf '%s\n' "${stray}"
            exit 1
          fi
          echo "Wheel is clean (source files only)."

  actionlint:
    # Syntax and semantic validation for GitHub Actions workflows. This catches
    # expression, event, permission, and shell interpolation mistakes before they
    # can break the release path. We download a fixed upstream binary and verify
    # its published digest instead of adding another third-party action.
    name: Run actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "${archive}" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p .tools/actionlint
          tar -xzf "${archive}" -C .tools/actionlint actionlint
      - name: Run actionlint
        run: .tools/actionlint/actionlint -color

  vale:
    # Prose gate: Vale with the vendored Google baseline plus the StandardASR
    # style (.vale.ini; the mechanizable subset of TERMINOLOGY.md). Fails on
    # ANY alert at ANY level -- STYLE.md's "Enforcement" keeps the full run at
    # zero. The selfcheck first proves the gate composition (config, glob,
    # targets) still flags planted violations in every directory target (a
    # green gate over a silently shrunken corpus is worse than no gate).
    # Same pinned-binary-plus-digest pattern as actionlint.
    name: Run Vale (prose)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install vale
        env:
          VALE_VERSION: "3.17.1"
          VALE_SHA256: "db947f89f2292e6a0381a61de155f6a5f5cb4cb460ca178ea412ef605559cefd"
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -fsSLo "${archive}" "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/${archive}"
          echo "${VALE_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p .tools/vale
          tar -xzf "${archive}" -C .tools/vale vale
      - name: Vale selfcheck (gate coverage)
        run: VALE=.tools/vale/vale scripts/vale.sh --selfcheck
      - name: Run Vale (zero-alert gate)
        run: VALE=.tools/vale/vale scripts/vale.sh --gate

  coverage:
    # Dedicated 100%-coverage gate. The matrix `test` lanes stay correctness-only
    # (and lower-bounds/numpy-floor may skip optional-dep paths), so the strict
    # `--cov-fail-under=100` lives here on a single, fully-provisioned interpreter
    # with every extra installed.
    name: Coverage 100% (py3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # clone the repo
      id-token: write # mint the OIDC token for tokenless Codecov upload
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked --all-groups --all-extras
      - name: Core coverage (100%)
        run: uv run --no-sync pytest --cov-fail-under=100
      - name: Upload coverage to Codecov
        # Auth is via OIDC (use_oidc + the job's id-token: write) — no static
        # CODECOV_TOKEN secret, and uploads are cryptographically verified as
        # coming from this workflow. Soft-fail: a Codecov outage must never
        # break CI.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

  zizmor:
    # GitHub Actions security audit. Folded into ci.yml (rather than a standalone
    # workflow) so it GATES merges via checks-complete instead of merely
    # reporting — under D8, branch protection requires only `checks-complete`, so
    # a separate workflow's red status would not block a merge. Fails on
    # high-severity findings (zizmor's default exit) and uploads SARIF.
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # github/codeql-action/upload-sarif
      contents: read # clone the repo (private repos)
      actions: read # upload-sarif reads workflow run info (private repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run zizmor (SARIF)
        # zizmor exits non-zero on findings at/above its default (high) threshold,
        # so this step fails the job — and thus checks-complete — on a finding.
        # Pinned (not @latest) so the gate is reproducible: a scanner release must
        # never be able to flip a previously-green PR red on its own schedule.
        # Bump deliberately, like every other pinned tool here.
        run: uvx zizmor@1.28.0 --format=sarif .github/workflows/ > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF to GitHub code scanning
        # SARIF upload needs a public repo or GitHub Advanced Security; if neither
        # applies the upload (not the audit) fails soft — the audit step already
        # gated the job above.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: zizmor

  docs:
    # Docs are a load-bearing product surface (the spec and the app-dev guides
    # are the contract's public face), and doc/code drift has repeatedly lived
    # under a green CI. Building the full static site here turns that whole
    # drift class into a failing PR check: the API reference is regenerated
    # from the source with Griffe, raw HTML that the Markdown pipeline would
    # drop fails the build, and a content or config defect fails the export.
    # The deploy workflow (docs.yml) builds the same way from main.
    name: Docs site build (static)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python dependencies (locked)
        run: uv sync --locked --all-extras --all-groups
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # The action reads `packageManager` from a package.json, and it
          # looks at the repository root by default. This repo has no root
          # package.json (Node serves only the docs), so point it at the
          # site's, keeping the pinned version in one place.
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - name: Install site dependencies (frozen)
        working-directory: docs/site
        run: pnpm install --frozen-lockfile
      - name: Lint the site (oxlint)
        working-directory: docs/site
        run: pnpm lint
      - name: Check formatting (oxfmt)
        working-directory: docs/site
        run: pnpm format:check
      - name: Build the static site
        working-directory: docs/site
        env:
          NEXT_PUBLIC_BASE_PATH: /standard_asr
        run: pnpm build
      - name: Prepare the link-check root
        # The export serves under the Pages project prefix, so absolute links
        # start with /standard_asr/. Mirror that shape so lychee's --root-dir
        # resolves them against the export.
        run: |
          mkdir -p "$RUNNER_TEMP/linkroot"
          ln -sfn "$GITHUB_WORKSPACE/docs/site/out" "$RUNNER_TEMP/linkroot/standard_asr"
      - name: Check exported links and fragments (lychee)
        # Offline on purpose: external links are excluded, so the check is
        # deterministic and immune to third-party outages. --include-fragments
        # also verifies every #anchor target, which guards the spec's stable
        # anchors.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --include-fragments --index-files index.html
            --root-dir "$RUNNER_TEMP/linkroot"
            'docs/site/out/**/*.html'

  checks-complete:
    # Single aggregate status required by branch protection (ADR D8). Adding a
    # new job above automatically tightens the gate via `needs`.
    name: checks-complete
    if: always()
    needs: [lock-check, lint, test, lower-bounds, core-floor, numpy-floor, build, actionlint, vale, coverage, zizmor, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs succeeded
        env:
          # join() expands matrix legs; values are job results, not user input.
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "::error::A required job did not succeed (got '${result}')."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
