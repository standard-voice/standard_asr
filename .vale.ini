# Vale configuration for Standard ASR prose.
#
# Baseline: the Google developer documentation style guide (the vendored
# `Google` package under .vale/styles, pinned by commit rather than fetched at
# run time). Repo-specific rules live in the `StandardASR` style; they encode
# the mechanizable subset of TERMINOLOGY.md. STYLE.md remains the human
# standard; Vale enforces what a regex can see and nothing more.
#
# CI fails on ANY alert at ANY level (scripts/vale.sh --gate); the corpus is
# kept at zero across errors, warnings, and suggestions (STYLE.md,
# "Enforcement").
#
# Two kinds of disables below, and the difference matters: a style delta
# (declared in STYLE.md, "Deltas from the Google guide" -- do not re-enable
# one without amending STYLE.md), and a mechanical adaptation of the checker
# (documented inline here -- it changes how Vale reads the text, never what
# good prose is).

StylesPath = .vale/styles
MinAlertLevel = suggestion

Vocab = StandardASR

# Python comments and docstrings are prose (STYLE.md tiers 2 and 3): lint them
# as Markdown via Vale's code-aware extraction.
[formats]
py = md

[*.md]
BasedOnStyles = Vale, Google, StandardASR
# Bare identifiers in prose (Args/Raises names, snake_case, CamelCase) are
# code, not words to spell-check. StandardASR.Spelling handles that with
# token-level filters and replaces the stock rule. Do NOT reintroduce
# TokenIgnores for this: a TokenIgnores rewrite that lands inside an inline
# code span corrupts Vale's span shielding and position mapping for the rest
# of the paragraph (phantom in-span alerts, wrong line numbers).
Vale.Spelling = NO
# House deltas (see STYLE.md): spaced em dashes; logical quoting around exact
# strings; passive voice allowed for the runtime actor; semicolon-joined
# clauses; uncontracted verbs; parenthetical nuance; no first-use expansion
# for ubiquitous acronyms (TERMINOLOGY.md covers domain vocabulary);
# first person allowed inside quotation marks that voice a stakeholder;
# capitals allowed after run-in label colons ("**Pre-1.0:** Minor ...").
Google.EmDash = NO
Google.Quotes = NO
Google.Passive = NO
Google.Semicolons = NO
Google.Contractions = NO
Google.Parens = NO
Google.Acronyms = NO
Google.FirstPerson = NO
Google.Colons = NO
# The serial comma is required (the baseline agrees), but the detector cannot
# tell a two-item pair or an appositive from a list; on this corpus nearly
# every hit was a false positive. Review owns the rule (see STYLE.md,
# "Enforcement").
Google.OxfordComma = NO

[*.py]
BasedOnStyles = Vale, Google, StandardASR
# Spelling is StandardASR.Spelling here too; see the [*.md] note.
Vale.Spelling = NO
Google.EmDash = NO
Google.Quotes = NO
Google.Passive = NO
Google.Semicolons = NO
Google.Contractions = NO
Google.Parens = NO
Google.Acronyms = NO
Google.FirstPerson = NO
Google.OxfordComma = NO
# Headings and heading-punctuation rules assume documents, not docstrings.
Google.Headings = NO
Google.HeadingPunctuation = NO
# Google-style docstring sections ("Args:\n  name: The ...") capitalize after
# a colon by convention; the rule cannot see the difference.
Google.Colons = NO
# A dotted exception name in a Google-style "Raises:" key
# ("pydantic.ValidationError: If ...") is bare by docstring convention and
# reads to the rule as a missing sentence space ("c.V"). Prose-side dotted
# names belong in code spans and are fixed, not exempted.
Google.Spacing = NO
# Adjacent one-line comments concatenate during extraction, so a run like
# "# Khmer" / "# Khmer Symbols" reads as a repeated word; version-like
# numerics ("0.0.9999") read as dates.
Vale.Repetition = NO
Google.DateFormat = NO

# --- Per-file adjustments ------------------------------------------------
# The statutes quote forbidden terms by necessity.
[{STYLE.md,TERMINOLOGY.md}]
StandardASR.Terminology = NO
StandardASR.Conformance = NO

# Project-voice documents legitimately say "we".
[{README.md,CONTRIBUTING.md,AGENTS.md,RELEASING.md,STYLE.md,TERMINOLOGY.md}]
Google.We = NO

[docs/{content/index.md,content/mission.md,content/goals.md,compatibility-advisories.md}]
Google.We = NO

# Spec pages and step-by-step guides number their headings ("## 3. REST
# endpoints"); the number is a stable cross-reference anchor (section 3,
# section 4.2), and the rule reads its trailing period as end punctuation.
[{RELEASING.md,docs/content/specification/cli.md,docs/content/specification/server-api.md,docs/content/specification/download-policy.md,docs/content/app-developers/discover-and-use.md}]
Google.HeadingPunctuation = NO

# A test comment may split one sentence across two comments that bracket the
# code under assertion ("# ...reported..." / "# ...and the valid engine still
# ran") -- see STYLE.md, "Split test comments". Elided code in a comment
# still belongs in a code span.
[tests/*.py]
Google.Ellipses = NO

# Doctest continuation and elided-output lines ("...     return X",
# "['a', 'b', ...]") are verbatim doctest syntax (STYLE.md tier 1); Vale's
# docstring view reads them as prose.
[src/standard_asr/plugins/discovery.py]
Google.Ellipses = NO

# --- Exempt paths -------------------------------------------------------
# Whole-file exemptions (Chinese documents, historical files, working notes)
# cannot be expressed in this file: an empty "BasedOnStyles =" section does
# not clear styles, and Vale offers no ignore file. The exemption lives in
# the --glob flag that scripts/vale.sh passes; run Vale through that script.
